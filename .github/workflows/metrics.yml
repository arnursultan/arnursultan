name: Metrics (SVG + Auto PNG)

on:
  schedule:
    - cron: "0 6 * * *"    
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Almaty
          output_action: commit
          committer_branch: RTX

  svg-to-png:
    needs: github-metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RTX branch
        uses: actions/checkout@v4
        with:
          ref: RTX
          persist-credentials: true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Convert SVG to PNG
        run: |
          if [ -f "metrics.svg" ]; then
            convert -background none metrics.svg metrics.png
          else
            echo "metrics.svg not found, skipping conversion" && exit 1
          fi

      - name: Commit and push metrics.png
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.png || echo "no changes"
          git commit -m "Auto-update metrics.png" || echo "No changes to commit"
          git push origin HEAD:RTX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
