name: WakaTime Stats ⏱

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  wakatime:
    runs-on: ubuntu-latest
    steps:
      - name: WakaTime Weekly Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_OS: "false"
          SHOW_PROJECTS: "true"
          SHOW_LOC_CHART: "true"
