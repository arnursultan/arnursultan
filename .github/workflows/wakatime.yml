name: WakaTime Stats ⏱

on:
  schedule:
    - cron: "0 1 * * *"  # Обновляется каждый день в 01:00 UTC
  workflow_dispatch:

jobs:
  wakatime:
    runs-on: ubuntu-latest
    steps:
      - name: Generate WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          SHOW_OS: "false"
          SHOW_PROJECTS: "true"
          SHOW_EDITORS: "true"
          SHOW_LANGUAGES: "true"
          SHOW_TIMEZONE: "false"
          SHOW_LOC_CHART: "true"
          SHOW_PROFILE_VIEWS: "false"
          SHOW_LINES_OF_CODE: "false"
          SHOW_COMMIT: "false"
          SHOW_UPDATED_DATE: "true"
          
          COMMIT_MESSAGE: "📊 Updated WakaTime Stats"
